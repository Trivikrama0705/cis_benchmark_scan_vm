name: cis-os-scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  id-token: write
  contents: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          echo "matrix=$(jq -c '.vms' config/scan-targets.json)" >> "$GITHUB_OUTPUT"

  scan:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest before making changes
        run: git pull --rebase

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check VM power state
        run: |
          STATE=$(az vm get-instance-view \
            --resource-group "${{ matrix.rg }}" \
            --name "${{ matrix.vm }}" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" \
            -o tsv)
          echo "VM power state: $STATE"

      - name: Run scan on ${{ matrix.vm }}
        run: |
          az vm run-command invoke \
            --resource-group "${{ matrix.rg }}" \
            --name "${{ matrix.vm }}" \
            --command-id RunShellScript \
            --scripts @scripts/scan-cis.sh \
            --query "value[0].message" -o tsv > raw-output.txt
          echo "----- RAW OUTPUT START -----"
          cat raw-output.txt
          echo "----- RAW OUTPUT END -----"

      - name: Upload raw output for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output-${{ matrix.vm }}
          path: raw-output.txt

      - name: Decode and save report
        run: |
          mkdir -p reports
          awk '/\[stdout\]/{flag=1; next} /\[stderr\]/{flag=0} flag' raw-output.txt > b64.txt
          echo "----- BASE64 EXTRACT SIZE -----"
          wc -l b64.txt
          base64 -d b64.txt > "reports/${{ matrix.vm }}-$(date +%Y-%m-%d).html" || echo "decode failed, check raw-output.txt"
          ls -la "reports/${{ matrix.vm }}-$(date +%Y-%m-%d).html"

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "CIS scan report: ${{ matrix.vm }} - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
