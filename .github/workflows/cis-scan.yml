name: cis-os-scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  id-token: write
  contents: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          echo "matrix=$(jq -c '.vms' config/scan-targets.json)" >> "$GITHUB_OUTPUT"

  scan:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate SAS URL for this VM's report
        id: sas
        run: |
          BLOB_NAME="${{ matrix.vm }}-$(date +%Y-%m-%d).html"
          EXPIRY=$(date -u -d "+1 hour" '+%Y-%m-%dT%H:%MZ')
          SAS_TOKEN=$(az storage blob generate-sas \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --container-name reports \
            --name "$BLOB_NAME" \
            --permissions cw \
            --expiry "$EXPIRY" \
            --auth-mode login --as-user -o tsv)
          SAS_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/reports/${BLOB_NAME}?${SAS_TOKEN}"
          echo "sas_url=$SAS_URL" >> "$GITHUB_OUTPUT"
          echo "blob_name=$BLOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Run scan on ${{ matrix.vm }} (uploads directly to blob storage)
        run: |
          az vm run-command invoke \
            --resource-group "${{ matrix.rg }}" \
            --name "${{ matrix.vm }}" \
            --command-id RunShellScript \
            --scripts @scripts/scan-cis.sh \
            --parameters "${{ steps.sas.outputs.sas_url }}" \
            --query "value[0].message" -o tsv

      - name: Download real report from blob storage
        run: |
          mkdir -p reports
          az storage blob download \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --container-name reports \
            --name "${{ steps.sas.outputs.blob_name }}" \
            --file "reports/${{ steps.sas.outputs.blob_name }}" \
            --auth-mode login
          ls -la "reports/${{ steps.sas.outputs.blob_name }}"

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "CIS scan report: ${{ matrix.vm }} - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
